<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: 鎖定縮放 (禁止雙擊放大) 並支援 iPhone 瀏海/安全區域 (viewport-fit=cover) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>篠笛曲集</title>
    <meta name="description" content="一個優雅的篠笛（日本橫笛）樂譜閱讀器，提供清晰的單線小節線譜面。" />
    <meta property="og:title" content="篠笛曲集" />
    <meta property="og:description" content="一個優雅的篠笛（日本橫笛）樂譜閱讀器，提供清晰的單線小節線譜面。" />

    <!-- PWA & iOS Safari 專屬設定 -->
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="篠笛曲集" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 處理 iOS Safari / PWA 舊版本快取或腳本加載失敗的自動修復機制
      window.__pwa_reloaded = window.sessionStorage.getItem('__sw_reload_attempt');
      function clearCachesAndReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var reg of regs) { reg.unregister(); }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var name of names) { caches.delete(name); }
              }).then(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }).catch(function() {
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
      }

      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        // 偵測是否為模組/資源檔案快取失效 (404 / Failed to fetch / Loading chunk failed)
        var isChunkError = /Failed to fetch|dynamically imported module|Importing a module script failed|Loading chunk/i.test(msg);
        if (isChunkError && !window.__pwa_reloaded) {
          window.sessionStorage.setItem('__sw_reload_attempt', '1');
          clearCachesAndReload();
          return;
        }

        // 如果頁面未掛載成功且出現腳本錯誤，避免停留在一片空白
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !document.getElementById('ios-safari-fallback')) {
            var banner = document.createElement('div');
            banner.id = 'ios-safari-fallback';
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#f5f5f0;padding:24px;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
            banner.innerHTML = '<div style="background:#fff;border:1px solid #e7e5e4;border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 15px -3px rgba(0,0,0,0.05);">' +
              '<div style="font-size:24px;margin-bottom:8px;">笛</div>' +
              '<div style="font-size:17px;font-weight:600;color:#1c1917;margin-bottom:6px;">篠笛曲集</div>' +
              '<div style="font-size:13px;color:#78716c;margin-bottom:20px;line-height:1.5;">Safari 偵測到舊快取或載入未完成，請點擊下方重整。</div>' +
              '<button onclick="clearCachesAndReload()" style="width:100%;padding:12px;background:#1c1917;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;">清除快取並重新載入</button>' +
              '</div>';
            document.body.appendChild(banner);
          }
        }, 1200);
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
